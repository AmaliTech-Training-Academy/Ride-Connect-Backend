services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

  frontend:
    image: ghcr.io/amalitech-training-academy/ride-connect-frontend:${FRONTEND_TAG}
    restart: unless-stopped
    networks:
      - edge

  api:
    image: ghcr.io/amalitech-training-academy/ride-connect-api:${API_TAG}
    restart: unless-stopped
    env_file:
      - api.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - backend

  migrate:
    image: ghcr.io/amalitech-training-academy/ride-connect-api:${API_TAG}
    env_file:
      - api.env
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - db.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - logs

  dozzle:
    image: amir20/dozzle:v11.1.3
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOZZLE_BASE: /logs
      DOZZLE_HOSTNAME: ride-connect
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_TTL: 48h
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - ./dozzle:/data
    depends_on:
      socket-proxy:
        condition: service_healthy
    networks:
      - edge
      - logs

networks:
  edge:
  backend:
  logs:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
