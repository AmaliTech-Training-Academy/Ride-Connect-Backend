name: CD

on:
  push:
    branches:
      - feat/t54-docker-compose

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/amalitech-training-academy/ride-connect-api:${{ steps.image.outputs.tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure EC2 instance is running
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.DOCKER_EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "Current state: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "Instance is not running (Current: $STATE)." >&2
            exit 1
          fi

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOCKER_EC2_SSH_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.DOCKER_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync stack files
        run: |
          ssh ${{ secrets.DOCKER_EC2_USER }}@${{ secrets.DOCKER_EC2_HOST }} "mkdir -p /opt/ride-connect"
          rsync -avz deploy/compose.yml deploy/Caddyfile \
            ${{ secrets.DOCKER_EC2_USER }}@${{ secrets.DOCKER_EC2_HOST }}:/opt/ride-connect/

      - name: Log the host in to GHCR
        env:
          TARGET: ${{ secrets.DOCKER_EC2_USER }}@${{ secrets.DOCKER_EC2_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | ssh "$TARGET" \
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull and start the stack
        run: |
          ssh ${{ secrets.DOCKER_EC2_USER }}@${{ secrets.DOCKER_EC2_HOST }} "
            set -e
            cd /opt/ride-connect
            touch .env
            TMP=\$(mktemp)
            grep -v '^API_TAG=' .env > \"\$TMP\" || [ \$? -eq 1 ]
            echo API_TAG=${{ steps.image.outputs.tag }} >> \"\$TMP\"
            cat \"\$TMP\" > .env
            rm \"\$TMP\"
            docker compose pull
            docker compose up -d
          "
