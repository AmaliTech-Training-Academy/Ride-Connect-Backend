name: CD
# just Want to trigger the pipeline again
on:
  push:
    branches:
      - develop
      - feat/t21-cd # running a test here so I do not have to wait for ci approval.

jobs:
  ci:
    uses: ./.github/workflows/ci.yml   # runs lint/test/build, must pass first
    secrets: inherit
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure EC2 instance is running
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "Current state: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "Instance is not running (Current: $STATE)." >&2
            exit 1
            # aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            # aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            # sleep 15
            # reason for those commits, is that I hope no code is merged into develop during off hours (TBD..yeah)
          fi

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync build to the server
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /opt/app/backend/current"
          rsync -avz ./dist ./package.json ./package-lock.json \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/app/backend/current/
 
      - name: Install prod deps, reload pm2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            cd /opt/app/backend/current
            npm ci 
            pm2 reload backend --update-env || pm2 start dist/server.js --name backend
          '
 