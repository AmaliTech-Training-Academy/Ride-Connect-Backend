name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - testing

jobs:
  conventions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check branch name
        run: npm run check:branch

      - name: Check commit messages
        run: npm run check:commits -- --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rideconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rideconnect_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Never connected to: tests/setup.ts overrides it with TEST_DATABASE_URL and
      # refuses to run if the two match.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rideconnect_dev
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rideconnect_test
      BETTER_AUTH_SECRET: ci-test-secret-not-used-outside-ci-0123456789
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Migrate test database
        run: npm run db:migrate:test

      - name: Test
        run: npm test
